name: Release

on:
  push:
    tags: ['v*']
  # Builds all artifacts without publishing anything.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches project version
        run: |
          version=$(grep -oP 'project\(soundchest VERSION \K[0-9.]+' CMakeLists.txt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match project version $version" >&2
            exit 1
          fi

  linux:
    uses: ./.github/workflows/_linux.yml

  windows:
    uses: ./.github/workflows/_windows.yml

  macos:
    uses: ./.github/workflows/_macos.yml

  release:
    needs: [verify, linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
