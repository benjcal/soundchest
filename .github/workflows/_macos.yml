name: Build (macOS)

on:
  workflow_call:

env:
  QT_VERSION: 6.8.3
  QLEMENTINE_VERSION: v1.4.2
  VCPKG_TRIPLET: arm64-osx-dynamic
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  package:
    name: DMG
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Locate vcpkg
        run: |
          root="${VCPKG_INSTALLATION_ROOT:-/usr/local/share/vcpkg}"
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"

      - name: Cache vcpkg packages
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_ROOT }}/installed
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-sndfile-v1

      - name: Install dependencies
        env:
          VCPKG_OSX_DEPLOYMENT_TARGET: ${{ env.MACOSX_DEPLOYMENT_TARGET }}
        run: |
          "$VCPKG_ROOT/vcpkg" install libsndfile \
            --triplet "$VCPKG_TRIPLET" --clean-after-build

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia
          cache: true

      - name: Build qlementine
        uses: ./.github/actions/qlementine
        with:
          version: ${{ env.QLEMENTINE_VERSION }}
          qt-prefix: ${{ env.QT_ROOT_DIR }}
          prefix: ${{ github.workspace }}/qlementine-install

      # libebur128 comes from source: the vcpkg port's headers were not
      # showing up in CMake's search paths, and a static build needs no
      # bundling step.
      - name: Build libebur128
        uses: ./.github/actions/ebur128
        with:
          prefix: ${{ github.workspace }}/ebur128-install
          deployment-target: ${{ env.MACOSX_DEPLOYMENT_TARGET }}

      - name: Verify dependencies
        run: |
          for file in \
            "$VCPKG_ROOT/installed/$VCPKG_TRIPLET/include/sndfile.h" \
            "${{ github.workspace }}/ebur128-install/include/ebur128.h"; do
            if [ ! -e "$file" ]; then
              find "$VCPKG_ROOT/installed" -maxdepth 3
              echo "missing dependency file: $file" >&2
              exit 1
            fi
          done
          ls "${{ github.workspace }}"/ebur128-install/lib*/libebur128.a >/dev/null
          ls "$VCPKG_ROOT/installed/$VCPKG_TRIPLET/lib/"libsndfile* >/dev/null

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$VCPKG_ROOT/installed/$VCPKG_TRIPLET;${{ github.workspace }}/qlementine-install;${{ github.workspace }}/ebur128-install" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Bundle dependencies
        run: |
          brew install dylibbundler
          mv build/soundchest.app "build/Sound Chest.app"
          # dylibbundler handles the plain dylibs from vcpkg (libsndfile and
          # its codec dependencies). -s resolves the @rpath references and
          # </dev/null keeps it from prompting interactively. Without -f it
          # leaves Qt frameworks alone; macdeployqt handles those next.
          dylibbundler -od -b \
            -s "$VCPKG_ROOT/installed/$VCPKG_TRIPLET/lib" \
            -x "build/Sound Chest.app/Contents/MacOS/soundchest" \
            -d "build/Sound Chest.app/Contents/Frameworks" \
            -p @executable_path/../Frameworks </dev/null
          macdeployqt "build/Sound Chest.app" -always-overwrite -no-translations

          fail=0
          while IFS= read -r -d '' binary; do
            file -b "$binary" | grep -q 'Mach-O' || continue
            if otool -L "$binary" | grep -Eq '/(opt/homebrew|usr/local|Users/runner)/'; then
              echo "unbundled references in $binary:" >&2
              otool -L "$binary" | grep -E '/(opt/homebrew|usr/local|Users/runner)/' >&2
              fail=1
            fi
          done < <(find "build/Sound Chest.app/Contents" -type f)
          [ "$fail" -eq 0 ]
          ls "build/Sound Chest.app/Contents/Frameworks" | grep -qi sndfile

          codesign --force --deep --sign - "build/Sound Chest.app"

      - name: Smoke test
        run: |
          log="$RUNNER_TEMP/smoke.log"
          "build/Sound Chest.app/Contents/MacOS/soundchest" >"$log" 2>&1 &
          app_pid=$!
          sleep 5
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat "$log"
            echo "app exited early" >&2
            exit 1
          fi
          kill "$app_pid"

      - name: Build DMG
        run: |
          version=$(grep -oP 'project\(soundchest VERSION \K[0-9.]+' CMakeLists.txt)
          mkdir -p dmg
          cp -R "build/Sound Chest.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Sound Chest" -srcfolder dmg -ov -format UDZO \
            "SoundChest-${version}-macos-arm64.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: soundchest-macos-arm64
          path: SoundChest-*-macos-arm64.dmg
          if-no-files-found: error
